<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HASE Lab</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<header><a class="brand" href="/">H.</a><div><strong>HASE Lab</strong><span class="muted">Course activities</span></div><div class="user-profile" aria-label="Your profile"><span class="avatar" aria-hidden="true">AM</span><div><strong>Alex Morgan <span class="you-label">You</span></strong><span>Team Maple · English</span></div></div></header>
<main><nav aria-label="Activities"><button data-task="workshops">◷ &nbsp; Workshops</button><button data-task="reviews">▤ &nbsp; Peer reviews</button><button data-task="buddies">◎ &nbsp; Study buddies</button></nav>
<section class="progress-panel" aria-label="Automatic checks"><div class="progress-heading"><strong id="check-summary" role="status">Checking saved code…</strong><button id="retry-checks">Check again</button></div><div id="step-status" class="step-status"></div><div class="check-footer"><p id="check-note"></p></div></section>
<section class="hero"><div><div id="module-label" class="eyebrow"></div><h1 id="flow-title"></h1><p id="description"></p><div id="context" class="profile"></div></div><div class="hero-mark" aria-hidden="true"></div></section>
<div id="error" role="alert" hidden></div><div class="toolbar"><h2><span id="list-title"></span> <span id="count" class="counter"></span></h2><div><button id="refresh">Refresh</button><button id="reset">Reset demo</button></div></div>
<div class="layout"><section id="cards" aria-live="polite"></section><aside><section class="panel"><h2 id="student-title"></h2><div id="commitments"></div></section><section class="panel activity"><h2>Latest activity</h2><div id="outcome" aria-live="polite"></div></section></aside></div>
<details class="roster"><summary id="record-title"></summary><div id="records"></div></details><footer>Fictional course data · Changes stay in this demo until reset or reload.</footer></main></body></html>
